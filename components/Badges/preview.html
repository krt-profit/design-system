<!-- @dsCard group="Components" height=210 width=700 subtitle="Squadron pills, dept tags, status dots" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../preview/_card.css">
<style>
  .specimen-surface { background: var(--color-bg-dark-gray); border: 1px solid var(--color-gray-3); padding: 16px; }
</style>
</head>
<body>
  <p class="pv-label">Badges, dept tags &amp; status pills</p>
  <div class="specimen-surface">
  <div class="pv-row" style="gap:10px; align-items:center; margin-bottom:14px;">
    <span class="squadron-badge">IRI</span>
    <span class="squadron-badge squadron-badge-muted">Created by</span>
    <span class="squadron-badge squadron-badge-foreign">Foreign</span>
    <span class="squadron-badge squadron-badge-sk">SK · Vipers</span>
  </div>
  <div class="pv-row" style="gap:10px; align-items:center; margin-bottom:14px;">
    <span class="dept-tag dept-tag--sub-radar">Sub-Radar</span>
    <span class="dept-tag dept-tag--profit">Profit</span>
    <span class="dept-tag dept-tag--raumueberlegenheit">Raumüberleg.</span>
    <span class="dept-tag dept-tag--search-rescue">S&amp;R</span>
    <span class="dept-tag dept-tag--forschung">Forschung</span>
    <span class="dept-tag dept-tag--marinekorps">Marinekorps</span>
  </div>
  <div class="pv-row" style="gap:18px; align-items:center;">
    <span class="status-pill status-planned">PLANNED</span>
    <span class="status-pill status-active">ACTIVE</span>
    <span class="status-pill status-completed">COMPLETED</span>
    <span class="status-pill status-cancelled">CANCELLED</span>
  </div>
  </div>
</body>
</html>
