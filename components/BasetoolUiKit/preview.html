<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profit Basetool — UI Kit</title>
<link rel="icon" type="image/svg+xml" href="../../assets/basetool-favicon.svg">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../krt-components.css">
<link rel="stylesheet" href="../../ui_kits/basetool/app.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<header id="kit-header" hidden></header>
<div id="root"></div>

<script type="text/babel" src="../../ui_kits/basetool/icons.jsx"></script>
<script type="text/babel" src="../../ui_kits/basetool/data.jsx"></script>
<script type="text/babel" src="../../ui_kits/basetool/components.jsx"></script>
<script type="text/babel" src="../../ui_kits/basetool/screens.jsx"></script>
<script type="text/babel" src="../../ui_kits/basetool/screen-mission-detail.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

const ADMIN_ROUTES = ["members", "uex", "settings"];
const STUBS = {
  refinery: ["Logistik", "Raffinerie", "Raffinerieaufträge sind in diesem Kit nicht nachgebaut."],
  orders: ["Logistik", "Aufträge", "Aufträge sind in diesem Kit nicht nachgebaut."],
  market: ["Handel", "Materialbörse", "Die Materialbörse ist in diesem Kit nicht nachgebaut."],
  supply: ["Handel", "Beschaffung", "Bedarf, Spenden und Ankauf sind in diesem Kit nicht nachgebaut."],
  unit: ["Staffel", "Meine Einheit", "Bank und Leitung der Einheit sind in diesem Kit nicht nachgebaut."],
  uex: ["Stammdaten", "Datenimporte", "UEX- und P4K-Importe sind Admin-Daten und hier nur ein Platzhalter."],
  settings: ["Betrieb", "Systemeinstellungen", "Systemeinstellungen sind Admin-Daten und hier nur ein Platzhalter."],
};

function App() {
  const [authed, setAuthed] = useState(false);
  const [route, setRoute] = useState("home");
  const [sidebar, setSidebar] = useState(false);
  const [adminNav, setAdminNav] = useState(false);
  const { toasts, push } = useToasts();
  const isAdmin = ADMIN_ROUTES.includes(route);

  useEffect(() => {
    document.body.classList.toggle("admin-mode", authed && isAdmin);
    document.getElementById("kit-header").hidden = !authed;
  }, [authed, isAdmin]);

  if (!authed) {
    return (
      <React.Fragment>
        <LoginScreen onLogin={() => { setAuthed(true); setRoute("home"); push("Angemeldet", "Willkommen zurück, Commander."); }} />
        <ToastViewport toasts={toasts} />
      </React.Fragment>
    );
  }

  let screen;
  if (STUBS[route]) {
    const [eyebrow, title, note] = STUBS[route];
    screen = <PlaceholderScreen eyebrow={eyebrow} title={title} note={note} />;
  } else {
    switch (route) {
      case "missions": screen = <MissionsScreen push={push} onOpen={() => setRoute("mission-detail")} />; break;
      case "mission-detail": screen = <MissionDetailScreen push={push} onBack={() => setRoute("missions")} />; break;
      case "hangar": screen = <HangarScreen push={push} />; break;
      case "lager": screen = <LagerScreen push={push} />; break;
      case "materials": screen = <MaterialsScreen />; break;
      case "members": screen = <MembersScreen />; break;
      default: screen = <Dashboard onOpenMission={() => setRoute("mission-detail")} />;
    }
  }

  return (
    <React.Fragment>
      <Header onHamburger={() => setSidebar(true)} onHome={() => setRoute("home")} unread={3} />
      <Sidebar open={sidebar} onClose={() => setSidebar(false)} current={route} admin={adminNav}
        onNavigate={setRoute} onToggleAdmin={() => setAdminNav((a) => !a)}
        onLogout={() => { setAuthed(false); setSidebar(false); setAdminNav(false); }} />
      <main className="app-main">{screen}</main>
      <Footer />
      <ToastViewport toasts={toasts} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
